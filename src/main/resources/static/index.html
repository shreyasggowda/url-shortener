<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create compact links and view their click statistics.">
  <title>Shortly — URL Shortener</title>
  <style>
    :root { color-scheme: dark; --page: #0c1020; --card: #151b31; --line: #2d3659; --text: #f5f7ff; --muted: #aeb8d8; --accent: #8b5cf6; --accent-dark: #7444da; --error: #ff8f9e; --success: #65e4b2; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--text); background: radial-gradient(circle at 10% 0%, #25204c 0, transparent 32rem), var(--page); }
    main { width: min(720px, calc(100% - 32px)); margin: 0 auto; padding: 86px 0 64px; }
    h1 { margin: 0; font-size: clamp(2.5rem, 8vw, 4.5rem); letter-spacing: -.07em; }
    h1 span { color: #a78bfa; }
    .intro { max-width: 560px; margin: 16px 0 42px; color: var(--muted); font-size: 1.1rem; line-height: 1.6; }
    .card { padding: clamp(22px, 5vw, 34px); margin-top: 20px; border: 1px solid var(--line); border-radius: 20px; background: color-mix(in srgb, var(--card) 91%, transparent); box-shadow: 0 22px 70px #02040f66; }
    h2 { margin: 0 0 20px; font-size: 1.25rem; }
    label { display: block; margin: 16px 0 8px; color: var(--muted); font-size: .9rem; font-weight: 650; }
    input { width: 100%; min-height: 49px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; outline: none; color: var(--text); font: inherit; background: #0e1428; }
    input:focus { border-color: #a78bfa; box-shadow: 0 0 0 3px #8b5cf633; }
    .row { display: flex; gap: 12px; align-items: end; }
    .row input { min-width: 0; }
    button { min-height: 49px; padding: 0 18px; border: 0; border-radius: 10px; cursor: pointer; color: white; font: 700 .95rem inherit; background: var(--accent); transition: background .15s, transform .15s; }
    button:hover { background: var(--accent-dark); } button:active { transform: translateY(1px); } button:disabled { opacity: .65; cursor: wait; }
    .result { display: none; margin-top: 22px; padding: 17px; border: 1px solid #38d99655; border-radius: 12px; background: #11332766; }
    .result.visible { display: block; } .result p { margin: 0 0 7px; color: var(--success); font-weight: 700; } .result a { color: #d4c5ff; font-weight: 700; overflow-wrap: anywhere; }
    .message { min-height: 22px; margin: 14px 0 0; color: var(--error); font-size: .92rem; } .message.success { color: var(--success); }
    .stats { display: none; margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--line); } .stats.visible { display: block; }
    .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 13px; } .stat { padding: 13px; border-radius: 10px; background: #0e1428; } .stat small { display: block; color: var(--muted); } .stat strong { display: block; margin-top: 5px; overflow-wrap: anywhere; font-size: 1.05rem; }
    footer { margin-top: 30px; color: var(--muted); text-align: center; font-size: .85rem; } @media (max-width: 520px) { main { padding-top: 52px; } .row { display: block; } .row button { width: 100%; margin-top: 12px; } .stat-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>Short links.<br><span>Big reach.</span></h1>
    <p class="intro">Turn a long URL into a clean, shareable link. Check its click count whenever you need it.</p>

    <section class="card" aria-labelledby="shorten-title">
      <h2 id="shorten-title">Create a short link</h2>
      <form id="shorten-form">
        <label for="long-url">Long URL</label>
        <input id="long-url" name="longUrl" type="url" placeholder="https://example.com/a/very/long/link" required>
        <label for="api-key">API key</label>
        <div class="row"><input id="api-key" name="apiKey" value="demo-key" required><button type="submit">Shorten URL</button></div>
      </form>
      <p class="message" id="create-message" role="alert"></p>
      <div class="result" id="create-result"><p>Your short link is ready</p><a id="short-link" href="#"></a><button id="copy-button" type="button" style="margin-top: 13px; min-height: 38px;">Copy link</button></div>
    </section>

    <section class="card" aria-labelledby="stats-title">
      <h2 id="stats-title">Link statistics</h2>
      <form id="stats-form"><label for="short-code">Short code</label><div class="row"><input id="short-code" placeholder="e.g. 1" required pattern="[A-Za-z0-9]+"><button type="submit">View stats</button></div></form>
      <p class="message" id="stats-message" role="alert"></p>
      <div class="stats" id="stats-result"><div class="stat-grid"><div class="stat"><small>Clicks</small><strong id="click-count"></strong></div><div class="stat"><small>Created</small><strong id="created-at"></strong></div><div class="stat" style="grid-column: 1 / -1"><small>Destination</small><strong id="destination"></strong></div></div></div>
    </section>
    <footer>Built with Spring Boot · Your links are ready to share</footer>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    const message = (id, text, success = false) => { const el = $(id); el.textContent = text; el.className = `message${success ? ' success' : ''}`; };
    const apiError = async (response) => { try { return (await response.json()).error || 'Something went wrong.'; } catch { return 'Something went wrong. Please try again.'; } };

    $('shorten-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = event.submitter; button.disabled = true; message('create-message', ''); $('create-result').classList.remove('visible');
      try {
        const response = await fetch('/api/urls', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-API-Key': $('api-key').value }, body: JSON.stringify({ longUrl: $('long-url').value }) });
        if (!response.ok) throw new Error(await apiError(response));
        const link = await response.json(); $('short-link').href = link.shortUrl; $('short-link').textContent = link.shortUrl; $('short-code').value = link.shortCode; $('create-result').classList.add('visible');
      } catch (error) { message('create-message', error.message); } finally { button.disabled = false; }
    });
    $('copy-button').addEventListener('click', async () => { await navigator.clipboard.writeText($('short-link').href); $('copy-button').textContent = 'Copied!'; setTimeout(() => $('copy-button').textContent = 'Copy link', 1500); });
    $('stats-form').addEventListener('submit', async (event) => {
      event.preventDefault(); const button = event.submitter; button.disabled = true; message('stats-message', ''); $('stats-result').classList.remove('visible');
      try {
        const code = $('short-code').value.trim(); const response = await fetch(`/api/urls/${encodeURIComponent(code)}/stats`);
        if (!response.ok) throw new Error(await apiError(response));
        const stats = await response.json(); $('click-count').textContent = stats.clickCount; $('created-at').textContent = new Date(stats.createdAt).toLocaleString(); $('destination').textContent = stats.longUrl; $('stats-result').classList.add('visible');
      } catch (error) { message('stats-message', error.message); } finally { button.disabled = false; }
    });
  </script>
</body>
</html>
